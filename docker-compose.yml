# Full local stack: MongoDB, Redis, the API, the queue worker and the web app.
#
#   docker compose up --build
#   web  http://localhost:8080      api  http://localhost:4000/ready
#
# AI keys are read from backend/.env (copy backend/.env.example). With no keys,
# set AI_PROVIDER=stub and EMBEDDING_PROVIDER=stub there and everything still
# runs with canned AI answers. To use Ollama on your host machine, set
# OLLAMA_BASE_URL=http://host.docker.internal:11434 in backend/.env.

x-backend: &backend
  build: ./backend
  env_file:
    - path: ./backend/.env
      required: false
  environment: &backend-env
    NODE_ENV: production
    MONGODB_URI: mongodb://mongo:27017/ai-career-coach
    REDIS_HOST: redis
    JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-access-secret}
    JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-only-refresh-secret}
    # Must match the address the browser uses for the web app (cookies + CORS).
    CLIENT_ORIGIN: http://localhost:8080
  init: true # reaps zombies and forwards SIGTERM so graceful shutdown runs
  restart: unless-stopped
  depends_on:
    mongo:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  mongo:
    image: mongo:7
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    <<: *backend
    ports: ["4000:4000"]
    stop_grace_period: 35s # longer than the app's 25 s shutdown limit

  worker:
    <<: *backend
    command: ["node", "src/worker.js"]
    healthcheck:
      disable: true # the worker has no HTTP port to probe
    stop_grace_period: 35s

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:4000/api/v1
    ports: ["8080:8080"]
    restart: unless-stopped
    depends_on:
      - api

volumes:
  mongo-data:
  redis-data:
