version: 2

# Weekly update pull requests. Minor and patch updates are grouped into a single PR
# per ecosystem so the review queue stays small; a major version always gets its own
# PR, because that is where breaking changes live. CI (tests, the AI quality gate,
# audits, image builds) runs on each one.
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      backend-minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies, backend]

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies, frontend]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    labels: [dependencies, ci]

  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly, day: monday }
    labels: [dependencies, docker]

  - package-ecosystem: docker
    directory: /frontend
    schedule: { interval: weekly, day: monday }
    labels: [dependencies, docker]
