name: Feature request
description: Suggest an improvement or a new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve, and for whom?
      description: A candidate, a recruiter, an operator? What do they struggle with today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: measure
    attributes:
      label: How would we know it worked?
      description: A number or an observable outcome. For AI features, which evaluation metric should move?
