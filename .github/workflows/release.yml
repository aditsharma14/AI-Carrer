name: Release images

# Builds the API/worker image and the web image and publishes them to GitHub
# Container Registry. It runs ONLY when you push a version tag or start it by
# hand, never on an ordinary push, so nothing is published unless you decide to:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Images: ghcr.io/<owner>/ai-career-api  (API, and the worker with `node src/worker.js`)
#         ghcr.io/<owner>/ai-career-web  (static web app behind nginx)
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write # to push images with the workflow's own token

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: the version for a tag push (v1.2.3 -> 1.2.3, 1.2), plus the commit SHA.
      - id: api-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/ai-career-api
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push the API and worker image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.api-meta.outputs.tags }}
          labels: ${{ steps.api-meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - id: web-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/ai-career-web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      # The API address is compiled into the web bundle, so it is a build input.
      # Set it under Settings > Secrets and variables > Actions > Variables.
      - name: Build and push the web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || 'http://localhost:4000/api/v1' }}
          tags: ${{ steps.web-meta.outputs.tags }}
          labels: ${{ steps.web-meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
