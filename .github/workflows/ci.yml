name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch cancels the run it makes obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # Tests run on the stub AI provider and fake credentials (test/setup.js),
      # so CI never needs secrets or network access to an AI API.
      - run: npm test
      # AI quality gate on the deterministic stub: fails if a code change moves
      # any parsing or ranking score from the committed baseline.
      - run: npm run eval:check
      # Fail on known-vulnerable production dependencies of the API.
      - run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend lint, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Fail on known-vulnerable production dependencies of the web app.
      - run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build API/worker image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  compose-smoke:
    name: Full stack smoke test
    runs-on: ubuntu-latest
    needs: [docker]
    steps:
      - uses: actions/checkout@v7
      - name: Start the stack on the stub AI provider
        run: |
          printf 'AI_PROVIDER=stub\nEMBEDDING_PROVIDER=stub\n' > backend/.env
          docker compose up -d --build
      - name: Wait for the API to be ready
        run: |
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4000/ready || true)
            [ "$code" = "200" ] && echo "ready after ${i} tries" && exit 0
            sleep 3
          done
          echo "API never became ready"; docker compose ps; docker compose logs --tail=80 api
          exit 1
      - name: Liveness and web app respond
        run: |
          curl -fsS http://localhost:4000/health
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/ | grep -qi '<div id="root"'
      - name: Graceful shutdown finishes cleanly
        run: |
          docker compose stop api worker
          for s in api worker; do
            code=$(docker compose ps -a --format '{{.Service}} {{.ExitCode}}' | awk -v s=$s '$1==s{print $2}')
            echo "$s exit code: $code"
            [ "$code" = "0" ] || { docker compose logs --tail=60 $s; exit 1; }
          done
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=100
