server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Hashed build assets never change, so browsers may cache them for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The app is a single-page app: any other path is a client-side route.
  # index.html itself must never be cached, or users keep an old build.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
